<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Private Time</title>
<style>
:root{--bg:#0b0b0f;--card:#15151b;--card2:#1d1d25;--text:#f5f5f7;--muted:#9999a5;--line:#2b2b35;--accent:#7c5cff;--danger:#ff5969}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
main{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:32px;letter-spacing:-1px;margin:4px 0 20px}.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.section{font-size:17px;font-weight:700;margin-bottom:12px}.timer{text-align:center}
.time{font-variant-numeric:tabular-nums;font-size:54px;font-weight:750;letter-spacing:-2px;margin:8px 0 16px}
select,input{width:100%;background:#202028;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;min-height:44px}
button{font:inherit;border:0;border-radius:13px;padding:11px 14px;min-height:44px;font-weight:650;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#25252e;color:#fff}.danger{background:#35171c;color:#ff929c}
.row{display:flex;gap:10px}.row>*{min-width:0;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats.stats-3{grid-template-columns:1fr 1fr 1fr}.stats.stats-1{grid-template-columns:1fr}
.stat{background:var(--card2);border-radius:15px;padding:14px}.num{font-size:23px;font-weight:700}.label{font-size:12px;color:var(--muted);margin-top:3px}
.stat.jump{cursor:pointer;border:1px solid transparent;width:100%;color:inherit;font:inherit;text-align:left}.stat.jump:hover{border-color:var(--line)}.stat.jump.active{border-color:var(--accent)}
.stat .num{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:calc(25% - 6px);font-size:14px;padding:9px 6px}.tabs .active{background:var(--accent)}
.period-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.period-nav button{flex:0 0 auto;min-width:44px;padding:9px 12px}.period-nav .period-title{flex:1;text-align:center;font-size:14px;font-weight:650;line-height:1.25}
.subsection{font-size:13px;font-weight:650;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.day-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.day-row:last-child{border-bottom:0}
.day-row small{color:var(--muted);font-size:12px}.day-scroll{max-height:220px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.bar{height:9px;background:#292932;border-radius:9px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);border-radius:9px}
.donut-wrap{display:flex;align-items:center;gap:18px;margin:4px 0 4px;flex-wrap:wrap}
.donut-chart{position:relative;width:148px;height:148px;flex:0 0 auto;margin:0 auto}
.donut-chart svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:18px}
.donut-center .num{font-size:18px;font-weight:700;line-height:1.1}.donut-center .label{font-size:11px;color:var(--muted);margin-top:3px}
.donut-legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px}
.donut-legend .leg{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;width:100%;background:transparent;color:inherit;border-radius:10px;padding:8px;text-align:left;font-weight:500;min-height:0}
.donut-legend .leg small{color:var(--muted);white-space:nowrap}
.hbar-list{margin-top:4px;display:flex;flex-direction:column;gap:6px}
.hbar-row{display:grid;grid-template-columns:minmax(72px,28%) 1fr auto;align-items:center;gap:10px;width:100%;background:transparent;color:inherit;border-radius:10px;padding:8px;text-align:left;font-weight:500;min-height:0}
.hbar-row .cat-name{min-width:0}.hbar-row .hbar-val{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.hbar-track{height:12px;background:#292932;border-radius:9px;overflow:hidden}.hbar-fill{height:100%;border-radius:9px;min-width:0}
.cat-pick{cursor:pointer;transition:opacity .15s,background .15s}.cat-pick:hover{background:var(--card2)}
.cat-pick.selected{background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}.cat-pick.dim{opacity:.38}
.stat .num.cat-focus{color:inherit}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item small{color:var(--muted)}.item-actions{display:flex;gap:6px;flex-shrink:0}.item-actions button{min-height:36px;padding:6px 9px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:12px}.note{font-size:12px;color:var(--muted);line-height:1.45}
.cat-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.cat-name{display:flex;align-items:center;gap:8px;min-width:0}
.cat-color{width:44px;min-height:36px;padding:4px;border-radius:10px;border:1px solid var(--line);background:#202028;cursor:pointer}
#statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
#subRow,#tagRow{margin-top:10px}#subRow[hidden],#tagRow[hidden]{display:none!important}
.subcat-panel{margin:4px 0 14px;padding:10px 12px;background:var(--card2);border-radius:12px}
.subcat-panel .subsection{margin:0 0 8px}
.sub-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.sub-item button{min-height:32px;padding:4px 8px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>Time</h1>

<div class="card timer">
  <div class="sub" id="status"><span id="statusDot" hidden></span><span id="statusText">Idle</span></div>
  <div class="time" id="clock">00:00:00</div>
  <select id="category"></select>
  <div id="subRow" hidden>
    <select id="subcategory"></select>
  </div>
  <div id="tagRow" hidden>
    <input id="sessionTag" list="tagList" placeholder="Title / name (optional)" maxlength="80" autocomplete="off">
    <datalist id="tagList"></datalist>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="start" type="button">Start</button>
    <button class="secondary" id="stop" type="button" disabled>Stop</button>
  </div>
</div>

<div class="card">
  <div class="section">Statistics</div>
  <div class="tabs">
    <button class="secondary active" data-period="day" type="button">Day</button>
    <button class="secondary" data-period="week" type="button">Week</button>
    <button class="secondary" data-period="month" type="button">Month</button>
    <button class="secondary" data-period="year" type="button">Year</button>
  </div>
  <div class="period-nav">
    <button class="secondary" id="periodPrev" type="button" aria-label="Previous">‹</button>
    <div class="period-title" id="periodTitle">—</div>
    <button class="secondary" id="periodNext" type="button" aria-label="Next">›</button>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="secondary" id="periodToday" type="button" style="flex:1">Go to today</button>
  </div>
  <div id="periodStatsAll" class="stats">
    <div class="stat"><div class="num" id="periodTotal">0m</div><div class="label" id="periodLabel">Total</div></div>
    <div class="stat" id="periodAvgStat"><div class="num" id="periodAvg">0m</div><div class="label" id="periodAvgLabel">Daily average</div></div>
  </div>
  <div id="periodStatsFocus" class="stats stats-3" hidden>
    <button class="stat jump" type="button" data-jump="day"><div class="num" id="focusDay">0m</div><div class="label">Day</div></button>
    <button class="stat jump" type="button" data-jump="week"><div class="num" id="focusWeek">0m</div><div class="label">Week</div></button>
    <button class="stat jump" type="button" data-jump="month"><div class="num" id="focusMonth">0m</div><div class="label">Month</div></button>
  </div>
  <div class="subsection">Share</div>
  <div id="periodDonut"></div>
  <div class="subsection">By category</div>
  <div id="periodCats"></div>
  <div class="subsection" id="periodSubsLabel" hidden>By subcategory</div>
  <div id="periodSubs" hidden></div>
  <div class="subsection" id="periodTagsLabel" hidden>By title</div>
  <div id="periodTags" hidden></div>
  <div class="subsection" id="periodBreakdownLabel" hidden>Breakdown</div>
  <div class="day-scroll" id="periodBreakdown" hidden></div>
</div>

<div class="card">
  <div class="section">History</div>
  <div id="history"></div>
</div>

<div class="card">
  <div class="section">Categories</div>
  <div class="row">
    <input id="newCat" placeholder="New category" maxlength="40">
    <button class="secondary" id="addCat" type="button">Add</button>
  </div>
  <div id="catList" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="section">Data</div>
  <div class="row">
    <button class="secondary" id="export" type="button">Export</button>
    <button class="secondary" id="importBtn" type="button">Import</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <button class="danger" id="wipe" style="width:100%;margin-top:10px" type="button">Delete all data</button>
  <p class="note" style="margin-bottom:0">Records are stored only in this browser&apos;s local storage. No account is required and history is never sent to a server.</p>
</div>
</main>

<script>
(function(){
"use strict";
// Keep legacy key so existing localStorage data still loads.
const KEY="tiempo_privado_v2";
const DEFAULT=["work","read","TV","sport","play","free"];
const DEFAULT_SUBS={read:["book","comic"],TV:["movie","series"]};
const NOSUB="(no subcategory)";
const NOTITLE="(no title)";
const PALETTE=["#7c5cff","#3dd68c","#ffb020","#ff5969","#3db9ff","#e879f9","#f472b6","#a3e635","#f97316","#22d3ee"];
const LOCALE="en-US";
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db||!Array.isArray(db.categories)||!Array.isArray(db.sessions)){
 db={categories:DEFAULT.slice(),sessions:[],active:null,colors:{},subcategories:{}};
}
if(!db.active) db.active=null;
if(!db.colors||typeof db.colors!=="object") db.colors={};
if(!db.subcategories||typeof db.subcategories!=="object") db.subcategories={};
if(db.categories.length===0) db.categories=DEFAULT.slice();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

function defaultColor(i){return PALETTE[i%PALETTE.length]}
function ensureColors(){
 const snap=JSON.stringify(db.colors);
 db.categories.forEach((c,i)=>{if(!db.colors[c])db.colors[c]=defaultColor(i)});
 Object.keys(db.colors).forEach(k=>{if(!db.categories.includes(k))delete db.colors[k]});
 if(JSON.stringify(db.colors)!==snap)save();
}
function ensureSubcategories(){
 const snap=JSON.stringify(db.subcategories);
 if(!db.categories.includes("TV")) db.categories.push("TV");
 Object.entries(DEFAULT_SUBS).forEach(([cat,subs])=>{
  if(db.categories.includes(cat)&&!Array.isArray(db.subcategories[cat])) db.subcategories[cat]=subs.slice();
 });
 Object.keys(db.subcategories).forEach(k=>{
  if(!db.categories.includes(k)) delete db.subcategories[k];
  else if(!Array.isArray(db.subcategories[k])) db.subcategories[k]=[];
  else db.subcategories[k]=db.subcategories[k].map(s=>String(s).trim()).filter(Boolean);
 });
 if(JSON.stringify(db.subcategories)!==snap)save();
}
function catColor(c){return db.colors[c]||defaultColor(Math.max(0,db.categories.indexOf(c)))}
function subsOf(cat){return Array.isArray(db.subcategories[cat])?db.subcategories[cat]:[]}
ensureColors();
ensureSubcategories();
const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const fmt=sec=>{sec=Math.max(0,Math.floor(sec));return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,"0")).join(":")};
const short=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${m}m`:m?`${m}m`:s?`${s}s`:"0m"};
const locDate={weekday:"short",day:"numeric",month:"short"};
const locMonth={month:"long",year:"numeric"};
let periodAnchor=new Date();
let selectedStatCat=null;
let selectedStatSub=null;
let selectedStatTag=null;

function sessionSub(x){return(x&&x.subcategory&&String(x.subcategory).trim())||""}
function sessionTag(x){return(x&&x.tag&&String(x.tag).trim())||""}
function subLabel(s){return s?s:NOSUB}
function tagLabel(tag){return tag?tag:NOTITLE}
function knownTags(cat,sub){
 const set=new Set();
 db.sessions.forEach(x=>{
  if(x.category!==cat)return;
  if(sub!==undefined&&sub!==null&&sessionSub(x)!==sub)return;
  if(sessionTag(x))set.add(sessionTag(x));
 });
 if(db.active&&db.active.category===cat){
  if(sub===undefined||sub===null||sessionSub(db.active)===sub){
   if(sessionTag(db.active))set.add(sessionTag(db.active));
  }
 }
 return [...set].sort((a,b)=>a.localeCompare(b,LOCALE));
}
function updateMetaRows(){
 const cat=$("category").value;
 const subs=subsOf(cat);
 $("subRow").hidden=!subs.length;
 if(subs.length){
  const cur=db.active&&db.active.category===cat?sessionSub(db.active):$("subcategory").value;
  $("subcategory").innerHTML=`<option value="">—</option>`+subs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
  if(subs.includes(cur))$("subcategory").value=cur;
 }
 const showTag=subs.length>0;
 $("tagRow").hidden=!showTag;
 if(showTag){
  const sub=$("subcategory").value;
  $("tagList").innerHTML=knownTags(cat,sub||null).map(t=>`<option value="${esc(t)}"></option>`).join("");
  if(db.active&&db.active.category===cat)$("sessionTag").value=sessionTag(db.active);
 }
}
function matchesFocus(x){
 if(selectedStatCat&&x.category!==selectedStatCat)return false;
 if(selectedStatSub!==null&&sessionSub(x)!==selectedStatSub)return false;
 if(selectedStatTag!==null&&sessionTag(x)!==selectedStatTag)return false;
 return true;
}
function clearStatFocus(){selectedStatCat=null;selectedStatSub=null;selectedStatTag=null}
function setStatCat(cat){
 if(selectedStatCat===cat) clearStatFocus();
 else{selectedStatCat=cat;selectedStatSub=null;selectedStatTag=null}
 renderPeriod();
}
function setStatSub(sub){
 if(selectedStatSub===sub){selectedStatSub=null;selectedStatTag=null}
 else{selectedStatSub=sub;selectedStatTag=null}
 renderPeriod();
}
function setStatTag(tag){
 if(selectedStatTag===tag) selectedStatTag=null;
 else selectedStatTag=tag;
 renderPeriod();
}

function setPeriodTab(period){
 document.querySelectorAll(".tabs button").forEach(x=>{
  x.classList.toggle("active",x.dataset.period===period);
 });
 renderPeriod();
}

function categorySeconds(cat,period,anchor,opts){
 const {start,end}=periodBounds(period,anchor);
 const sub=opts&&opts.sub,tag=opts&&opts.tag;
 const ss=sessionsInPeriod(period,anchor).filter(x=>{
  if(x.category!==cat)return false;
  if(sub!==undefined&&sub!==null&&sessionSub(x)!==sub)return false;
  if(tag!==undefined&&tag!==null&&sessionTag(x)!==tag)return false;
  return true;
 });
 let total=0;
 ss.forEach(x=>{total+=clipSessionSeconds(x,start,end)});
 return total;
}
function aggregateByKey(sessions,rangeStart,rangeEnd,keyFn){
 const map={};let total=0;
 sessions.forEach(x=>{
  const t=clipSessionSeconds(x,rangeStart,rangeEnd);
  if(t<=0)return;
  const key=keyFn(x);
  total+=t;map[key]=(map[key]||0)+t;
 });
 return {map,total};
}

const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const endOfDay=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x};
const startOfWeek=d=>{const x=startOfDay(d);const w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x};
const endOfWeek=d=>{const x=startOfWeek(d);x.setDate(x.getDate()+6);return endOfDay(x)};
const startOfMonth=d=>startOfDay(new Date(d.getFullYear(),d.getMonth(),1));
const endOfMonth=d=>endOfDay(new Date(d.getFullYear(),d.getMonth()+1,0));
const startOfYear=d=>startOfDay(new Date(d.getFullYear(),0,1));
const endOfYear=d=>endOfDay(new Date(d.getFullYear(),11,31));
const isSameDay=(a,b)=>dayKey(a)===dayKey(b);

function currentPeriod(){
 return document.querySelector(".tabs .active")?.dataset.period||"day";
}

function periodBounds(period,anchor){
 const a=new Date(anchor);
 if(period==="day") return {start:startOfDay(a),end:endOfDay(a),spanDays:1};
 if(period==="week") return {start:startOfWeek(a),end:endOfWeek(a),spanDays:7};
 if(period==="month"){
  const start=startOfMonth(a),end=endOfMonth(a);
  return {start,end,spanDays:Math.round((end-start)/86400000)+1};
 }
 const start=startOfYear(a),end=endOfYear(a);
 return {start,end,spanDays:Math.round((end-start)/86400000)+1};
}

function periodTitle(period,anchor){
 const a=new Date(anchor);
 if(period==="day"){
  const t=a.toLocaleDateString(LOCALE,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return isSameDay(a,Date.now())?`Today · ${t}`:t;
 }
 if(period==="week"){
  const {start,end}=periodBounds("week",a);
  const s=start.toLocaleDateString(LOCALE,{day:"numeric",month:"short"});
  const e=end.toLocaleDateString(LOCALE,{day:"numeric",month:"short",year:"numeric"});
  return `${s} – ${e}`;
 }
 if(period==="month") return a.toLocaleDateString(LOCALE,locMonth);
 return String(a.getFullYear());
}

function clipSessionSeconds(x,rangeStart,rangeEnd){
 const now=Date.now();
 const endCap=Math.min(rangeEnd.getTime(),now);
 if(x.end<=rangeStart.getTime()||x.start>=endCap)return 0;
 const a=Math.max(x.start,rangeStart.getTime()),b=Math.min(x.end,endCap);
 return Math.max(0,(b-a)/1000);
}

function sessionsInPeriod(period,anchor){
 const {start,end}=periodBounds(period,anchor);
 return db.sessions.filter(x=>x.end>start.getTime()&&x.start<end.getTime()+1);
}

function aggregateByCategory(sessions,rangeStart,rangeEnd){
 const map={};let total=0;
 sessions.forEach(x=>{
  const t=clipSessionSeconds(x,rangeStart,rangeEnd);
  if(t<=0)return;
  total+=t;map[x.category]=(map[x.category]||0)+t;
 });
 return {map,total};
}

function aggregateByDayKey(sessions,rangeStart,rangeEnd){
 const by={};
 sessions.forEach(x=>{
  if(x.end<=rangeStart.getTime()||x.start>rangeEnd.getTime())return;
  let d=startOfDay(new Date(Math.max(x.start,rangeStart.getTime())));
  const last=endOfDay(new Date(Math.min(x.end,rangeEnd.getTime())));
  while(d<=last){
   const dk=dayKey(d);
   const dayStart=d.getTime(),dayEnd=endOfDay(d).getTime();
   const a=Math.max(x.start,rangeStart.getTime(),dayStart);
   const b=Math.min(x.end,rangeEnd.getTime(),dayEnd,Date.now());
   const sec=Math.max(0,(b-a)/1000);
   if(sec>0)by[dk]=(by[dk]||0)+sec;
   d.setDate(d.getDate()+1);
  }
 });
 return by;
}

function aggregateByMonth(sessions,rangeStart,rangeEnd){
 const by={};
 sessions.forEach(x=>{
  if(clipSessionSeconds(x,rangeStart,rangeEnd)<=0)return;
  for(let m=0;m<12;m++){
   const ms=startOfMonth(new Date(rangeStart.getFullYear(),m,1));
   const me=endOfMonth(ms);
   const a=Math.max(x.start,ms.getTime(),rangeStart.getTime());
   const b=Math.min(x.end,me.getTime(),rangeEnd.getTime(),Date.now());
   const sec=Math.max(0,(b-a)/1000);
   if(sec>0){
    const key=`${ms.getFullYear()}-${String(m+1).padStart(2,"0")}`;
    by[key]=(by[key]||0)+sec;
   }
  }
 });
 return by;
}

function shiftAnchor(period,dir){
 const a=new Date(periodAnchor);
 if(period==="day") a.setDate(a.getDate()+dir);
 else if(period==="week") a.setDate(a.getDate()+7*dir);
 else if(period==="month") a.setMonth(a.getMonth()+dir);
 else a.setFullYear(a.getFullYear()+dir);
 periodAnchor=a;
}

function sortedCategoryEntries(map){
 return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function renderDonut(entries,total){
 const el=$("periodDonut");
 if(!entries.length||total<=0){
  el.innerHTML='<div class="empty">No time logged in this period.</div>';
  return;
 }
 const r=54,cx=70,cy=70,stroke=18;
 const circ=2*Math.PI*r;
 let offset=0;
 const focus=selectedStatCat&&entries.some(([c])=>c===selectedStatCat)?selectedStatCat:null;
 const focusTotal=focus?(entries.find(([c])=>c===focus)?.[1]||0):total;
 const arcs=entries.map(([c,t])=>{
  const frac=t/total;
  const len=frac*circ;
  const gap=entries.length>1?1.2:0;
  const dash=Math.max(0,len-gap);
  const col=catColor(c);
  const dim=focus&&c!==focus?` opacity="0.28"`:"";
  const html=`<circle class="cat-pick" data-cat="${esc(c)}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${esc(col)}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" stroke-linecap="butt"${dim} style="cursor:pointer"/>`;
  offset+=len;
  return html;
 }).join("");
 const legend=entries.map(([c,t])=>{
  const pct=Math.round(t/total*100);
  const cls=["leg","cat-pick"];
  if(focus===c) cls.push("selected");
  else if(focus) cls.push("dim");
  return `<button type="button" class="${cls.join(" ")}" data-cat="${esc(c)}"><span class="cat-name"><span class="cat-dot" style="background:${esc(catColor(c))}"></span>${esc(c)}</span><small>${short(t)} · ${pct}%</small></button>`;
 }).join("");
 const centerLabel=focus?focus:"total";
 const centerColor=focus?catColor(focus):"";
 el.innerHTML=`
  <div class="donut-wrap">
   <div class="donut-chart" role="img" aria-label="Category share for period. Tap a category to focus totals.">
    <svg viewBox="0 0 140 140" aria-hidden="true">
     <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#292932" stroke-width="${stroke}"/>
     ${arcs}
    </svg>
    <div class="donut-center"><div class="num" style="${centerColor?`color:${esc(centerColor)}`:""}">${esc(short(focusTotal))}</div><div class="label">${esc(centerLabel)}</div></div>
   </div>
   <div class="donut-legend">${legend}</div>
  </div>`;
}

function renderCategoryBars(entries,total){
 const el=$("periodCats");
 if(!entries.length||total<=0){
  el.innerHTML='<div class="empty">No time logged in this period.</div>';
  return;
 }
 const max=Math.max(...entries.map(e=>e[1]),1);
 const focus=selectedStatCat&&entries.some(([c])=>c===selectedStatCat)?selectedStatCat:null;
 el.innerHTML=`<div class="hbar-list">${entries.map(([c,t])=>{
  const pct=Math.round(t/Math.max(total,1)*100);
  const w=Math.max(2,(t/max)*100);
  const cls=["hbar-row","cat-pick"];
  if(focus===c) cls.push("selected");
  else if(focus) cls.push("dim");
  return `<button type="button" class="${cls.join(" ")}" data-cat="${esc(c)}">
   <span class="cat-name"><span class="cat-dot" style="background:${esc(catColor(c))}"></span>${esc(c)}</span>
   <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${esc(catColor(c))}"></div></div>
   <span class="hbar-val">${short(t)} · ${pct}%</span>
  </button>`;
 }).join("")}</div>`;
}

function sessionTitle(x){
 const parts=[x.category];
 if(sessionSub(x)) parts.push(sessionSub(x));
 if(sessionTag(x)) parts.push(sessionTag(x));
 return parts.join(" · ");
}

function renderCategories(){
 $("category").innerHTML=db.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
 $("catList").innerHTML=db.categories.map((c,i)=>{
  const subs=subsOf(c);
  return `<div class="cat-block">
  <div class="item">
   <span class="cat-name"><span class="cat-dot" style="background:${esc(catColor(c))}"></span>${esc(c)}</span>
   <div class="item-actions">
    <input type="color" class="cat-color pickColor" data-i="${i}" value="${esc(catColor(c))}" title="Color" aria-label="Color for ${esc(c)}">
    <button class="secondary renameCat" data-i="${i}" type="button">Edit</button>
    ${db.categories.length>1?`<button class="danger deleteCat" data-i="${i}" type="button">Delete</button>`:""}
   </div>
  </div>
  <div class="subcat-panel">
   <div class="subsection">Subcategories</div>
   ${subs.map(s=>`<div class="sub-item"><span>${esc(s)}</span><button class="danger deleteSub" data-cat="${esc(c)}" data-sub="${esc(s)}" type="button">Remove</button></div>`).join("")||'<div class="empty" style="padding:4px 0">No subcategories yet.</div>'}
   <div class="row" style="margin-top:8px">
    <input class="newSubInput" data-cat="${esc(c)}" placeholder="New subcategory" maxlength="40">
    <button class="secondary addSub" data-cat="${esc(c)}" type="button">Add</button>
   </div>
  </div>
 </div>`;
 }).join("");
}

function renderFocusStats(focus){
 const all=$("periodStatsAll"),box=$("periodStatsFocus");
 if(!focus){
  all.hidden=false;box.hidden=true;return;
 }
 all.hidden=true;box.hidden=false;
 const col=catColor(focus);
 const opts={sub:selectedStatSub,tag:selectedStatTag};
 const dayT=categorySeconds(focus,"day",periodAnchor,opts);
 const weekT=categorySeconds(focus,"week",periodAnchor,opts);
 const monthT=categorySeconds(focus,"month",periodAnchor,opts);
 $("focusDay").textContent=short(dayT);
 $("focusWeek").textContent=short(weekT);
 $("focusMonth").textContent=short(monthT);
 $("focusDay").style.color=col;
 $("focusWeek").style.color=col;
 $("focusMonth").style.color=col;
 const period=currentPeriod();
 document.querySelectorAll("#periodStatsFocus .stat.jump").forEach(b=>{
  b.classList.toggle("active",b.dataset.jump===period);
 });
}

function renderKeyedBars(elId,labId,entries,total,fillColor,kind,selected,labelFn,title){
 const el=$(elId),lab=$(labId);
 if(!entries.length){lab.hidden=true;el.hidden=true;return}
 lab.hidden=false;el.hidden=false;
 lab.textContent=title;
 const max=Math.max(...entries.map(e=>e[1]),1);
 const dataAttr=kind==="sub"?"data-sub":"data-tag";
 const pickClass=kind==="sub"?"sub-pick":"tag-pick";
 el.innerHTML=`<div class="hbar-list">${entries.map(([key,t])=>{
  const pct=Math.round(t/Math.max(total,1)*100);
  const w=Math.max(2,(t/max)*100);
  const cls=["hbar-row","cat-pick",pickClass];
  if(selected===key) cls.push("selected");
  else if(selected!==null) cls.push("dim");
  return `<button type="button" class="${cls.join(" ")}" ${dataAttr}="${esc(key)}">
   <span class="cat-name">${esc(labelFn(key))}</span>
   <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${esc(fillColor)}"></div></div>
   <span class="hbar-val">${short(t)} · ${pct}%</span>
  </button>`;
 }).join("")}</div>`;
}

function renderDaySessions(sessions,rangeStart,rangeEnd){
 const list=sessions
  .map(x=>{
   const t=clipSessionSeconds(x,rangeStart,rangeEnd);
   if(t<=0)return null;
   if(!matchesFocus(x))return null;
   return {x,t};
  })
  .filter(Boolean)
  .sort((a,b)=>a.x.start-b.x.start);
 if(!list.length) return '<div class="empty">No sessions in this day.</div>';
 return list.map(({x,t})=>`
  <div class="day-row">
   <div><span class="cat-name"><span class="cat-dot" style="background:${esc(catColor(x.category))}"></span>${esc(sessionTitle(x))}</span><br><small>${new Date(x.start).toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"})} – ${new Date(Math.min(x.end,rangeEnd.getTime(),Date.now())).toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"})}</small></div>
   <span>${short(t)}</span>
  </div>`).join("");
}

function renderPeriod(){
 const period=currentPeriod();
 const {start,end,spanDays}=periodBounds(period,periodAnchor);
 $("periodTitle").textContent=periodTitle(period,periodAnchor);
 const ss=sessionsInPeriod(period,periodAnchor);
 const {map,total}=aggregateByCategory(ss,start,end);
 if(selectedStatCat&&!db.categories.includes(selectedStatCat)) selectedStatCat=null;
 const elapsedDays=period==="day"?1:Math.min(spanDays,Math.max(1,Math.ceil((Math.min(Date.now(),end.getTime())-start.getTime())/86400000)));
 const focus=selectedStatCat;
 if(!focus){selectedStatSub=null;selectedStatTag=null}
 const ssFocus=ss.filter(matchesFocus);
 const focusTotal=focus?ssFocus.reduce((a,x)=>a+clipSessionSeconds(x,start,end),0):total;

 if(!focus){
  $("periodTotal").textContent=short(total);
  $("periodTotal").style.color="";
  $("periodAvg").style.color="";
  $("periodLabel").textContent=period==="day"?"Total for day":"Total for period";
  $("periodAvg").textContent=short(total/elapsedDays);
  $("periodAvgLabel").textContent="Daily average";
  $("periodAvgStat").hidden=period==="day";
  $("periodStatsAll").classList.toggle("stats-1",period==="day");
 }else{
  $("periodAvgStat").hidden=false;
  $("periodStatsAll").classList.remove("stats-1");
 }
 renderFocusStats(focus);

 const entries=sortedCategoryEntries(map);
 renderDonut(entries,total);
 renderCategoryBars(entries,total);

 if(focus&&(subsOf(focus).length||ss.some(x=>x.category===focus&&sessionSub(x)))){
  const base=ss.filter(x=>x.category===focus);
  const subAgg=aggregateByKey(base,start,end,sessionSub);
  const subEntries=Object.entries(subAgg.map).sort((a,b)=>b[1]-a[1]);
  const subTitle=selectedStatSub!==null?`By subcategory · ${subLabel(selectedStatSub)}`:"By subcategory";
  renderKeyedBars("periodSubs","periodSubsLabel",subEntries,subAgg.total||1,catColor(focus),"sub",selectedStatSub,subLabel,subTitle);
 }else{
  $("periodSubsLabel").hidden=true;$("periodSubs").hidden=true;
 }

 if(focus){
  const base=ss.filter(x=>x.category===focus&&(selectedStatSub===null||sessionSub(x)===selectedStatSub));
  const tagAgg=aggregateByKey(base,start,end,sessionTag);
  const tagEntries=Object.entries(tagAgg.map).filter(([k,t])=>k||t>0).sort((a,b)=>b[1]-a[1]);
  if(tagEntries.some(([k])=>k)||selectedStatSub!==null){
   const tagTitle=selectedStatTag!==null?`By title · ${tagLabel(selectedStatTag)}`:"By title";
   renderKeyedBars("periodTags","periodTagsLabel",tagEntries,tagAgg.total||1,catColor(focus),"tag",selectedStatTag,tagLabel,tagTitle);
  }else{
   $("periodTagsLabel").hidden=true;$("periodTags").hidden=true;
  }
 }else{
  $("periodTagsLabel").hidden=true;$("periodTags").hidden=true;
 }

 const bl=$("periodBreakdownLabel"),bd=$("periodBreakdown");
 bl.hidden=false;bd.hidden=false;
 const fillColor=focus?catColor(focus):"";
 const denom=Math.max(focus?focusTotal:total,1);
 const focusParts=focus?[focus]:[];
 if(focus&&selectedStatSub!==null) focusParts.push(subLabel(selectedStatSub));
 if(focus&&selectedStatTag!==null) focusParts.push(tagLabel(selectedStatTag));
 const focusTitle=focusParts.join(" · ");

 if(period==="day"){
  bl.textContent=focus?`Sessions · ${focusTitle}`:"Sessions";
  bd.innerHTML=renderDaySessions(ss,start,end);
  return;
 }
 if(period==="year"){
  bl.textContent=focus?`By month · ${focusTitle}`:"By month";
  const byMonth=aggregateByMonth(ssFocus,start,end);
  const rows=[];
  for(let m=0;m<12;m++){
   const key=`${start.getFullYear()}-${String(m+1).padStart(2,"0")}`;
   const t=byMonth[key]||0;
   const label=new Date(start.getFullYear(),m,1).toLocaleDateString(LOCALE,{month:"short"});
   rows.push({label,sub:"",t});
  }
  const maxB=Math.max(...rows.map(r=>r.t),1);
  bd.innerHTML=rows.map(r=>`
   <div class="day-row">
    <span>${esc(r.label)}</span>
    <span>${short(r.t)}${r.t?` <small>· ${Math.round(r.t/denom*100)}%</small>`:""}</span>
   </div>
   <div class="bar" style="margin-top:-4px;margin-bottom:8px"><div class="fill" style="width:${r.t/maxB*100}%;${fillColor?`background:${esc(fillColor)}`:""}"></div></div>`).join("");
  return;
 }
 bl.textContent=(period==="week"?"By day":"By day of month")+(focus?` · ${focusTitle}`:"");
 const byDay=aggregateByDayKey(ssFocus,start,end);
 const rows=[];
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
  const dk=dayKey(d);
  const t=byDay[dk]||0;
  const label=d.toLocaleDateString(LOCALE,locDate);
  const sub=isSameDay(d,Date.now())?"today":"";
  rows.push({label,sub,t});
 }
 const maxB=Math.max(...rows.map(r=>r.t),1);
 bd.innerHTML=rows.map(r=>`
  <div class="day-row">
   <div><span>${esc(r.label)}</span>${r.sub?` <small>${esc(r.sub)}</small>`:""}</div>
   <span>${short(r.t)}${r.t?` <small>· ${Math.round(r.t/denom*100)}%</small>`:""}</span>
  </div>
  <div class="bar" style="margin-top:-4px;margin-bottom:8px"><div class="fill" style="width:${r.t/maxB*100}%;${fillColor?`background:${esc(fillColor)}`:""}"></div></div>`).join("")||'<div class="empty">No data.</div>';
}

function render(){
 renderCategories();
 const recent=[...db.sessions].sort((a,b)=>b.start-a.start).slice(0,30);
 $("history").innerHTML=recent.map((x,i)=>`
  <div class="item">
   <div><b class="cat-name"><span class="cat-dot" style="background:${esc(catColor(x.category))}"></span>${esc(sessionTitle(x))}</b><br><small>${new Date(x.start).toLocaleString(LOCALE)} · ${new Date(x.end).toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"})}</small></div>
   <div class="item-actions">
    <b style="padding-top:9px">${short((x.end-x.start)/1000)}</b>
    <button class="secondary editSession" data-i="${db.sessions.indexOf(x)}" type="button">Edit</button>
    <button class="danger deleteSession" data-i="${db.sessions.indexOf(x)}" type="button">Delete</button>
   </div>
  </div>`).join("")||'<div class="empty">No sessions yet.</div>';

 if(db.active){
   const col=catColor(db.active.category);
   $("statusText").textContent=sessionTitle(db.active);
   $("statusDot").hidden=false;$("statusDot").style.background=col;
   $("clock").style.color=col;
   $("start").disabled=true;$("stop").disabled=false;
   $("category").value=db.active.category;$("category").disabled=true;
 }else{
   $("statusText").textContent="Idle";
   $("statusDot").hidden=true;$("clock").style.color="";
   $("start").disabled=false;$("stop").disabled=true;$("category").disabled=false;
 }
 updateMetaRows();
 const lock=!!db.active;
 $("subcategory").disabled=lock;
 $("sessionTag").disabled=lock;
 renderPeriod();
}

function tick(){$("clock").textContent=db.active?fmt((Date.now()-db.active.start)/1000):"00:00:00"}

$("category").addEventListener("change",updateMetaRows);
$("subcategory").addEventListener("change",()=>{
 const cat=$("category").value;
 $("tagList").innerHTML=knownTags(cat,$("subcategory").value||null).map(t=>`<option value="${esc(t)}"></option>`).join("");
});
$("start").addEventListener("click",()=>{
 if(db.active)return;
 const category=$("category").value;
 const subcategory=subsOf(category).length?$("subcategory").value.trim():"";
 const tag=subsOf(category).length?$("sessionTag").value.trim():"";
 db.active={category,start:Date.now(),...(subcategory?{subcategory}:{}),...(tag?{tag}:{})};save();render();
});
$("stop").addEventListener("click",()=>{
 if(!db.active)return;
 const row={category:db.active.category,start:db.active.start,end:Date.now()};
 if(sessionSub(db.active)) row.subcategory=sessionSub(db.active);
 if(sessionTag(db.active)) row.tag=sessionTag(db.active);
 db.sessions.push(row);
 db.active=null;save();render();tick();
});
function addCategory(){
 const c=$("newCat").value.trim();
 if(!c){alert("Enter a category name.");return}
 if(db.categories.some(x=>x.toLowerCase()===c.toLowerCase())){alert("That category already exists.");return}
 db.categories.push(c);
 db.colors[c]=defaultColor(db.categories.length-1);
 if(!Array.isArray(db.subcategories[c])) db.subcategories[c]=DEFAULT_SUBS[c]?DEFAULT_SUBS[c].slice():[];
 $("newCat").value="";save();render();
}
$("addCat").addEventListener("click",addCategory);
$("newCat").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addCategory()}});

document.addEventListener("input",e=>{
 const pc=e.target.closest(".pickColor");
 if(!pc)return;
 const i=Number(pc.dataset.i),cat=db.categories[i];
 if(!cat)return;
 db.colors[cat]=pc.value;save();render();
});

document.addEventListener("click",e=>{
 const b=e.target.closest(".renameCat");
 if(b){
   const i=Number(b.dataset.i),old=db.categories[i],name=prompt("Category name:",old);
   if(name===null)return;
   const n=name.trim();
   if(!n||n===old)return;
   if(db.categories.includes(n)){alert("That category already exists.");return}
   db.categories[i]=n;
   db.colors[n]=db.colors[old]||defaultColor(i);
   delete db.colors[old];
   if(Array.isArray(db.subcategories[old])){db.subcategories[n]=db.subcategories[old];delete db.subcategories[old]}
   db.sessions.forEach(x=>{if(x.category===old)x.category=n});
   if(db.active?.category===old)db.active.category=n;
   if(selectedStatCat===old) selectedStatCat=n;
   save();render();return;
 }
 const as=e.target.closest(".addSub");
 if(as){
   const cat=as.dataset.cat;
   const input=as.closest(".subcat-panel")?.querySelector(".newSubInput");
   const name=(input?input.value:"").trim();
   if(!name){alert("Enter a subcategory name.");return}
   if(!Array.isArray(db.subcategories[cat])) db.subcategories[cat]=[];
   if(db.subcategories[cat].some(s=>s.toLowerCase()===name.toLowerCase())){alert("That subcategory already exists.");return}
   db.subcategories[cat].push(name);if(input)input.value="";save();render();return;
 }
 const dsub=e.target.closest(".deleteSub");
 if(dsub){
   const cat=dsub.dataset.cat,sub=dsub.dataset.sub;
   if(db.sessions.some(x=>x.category===cat&&sessionSub(x)===sub)||(db.active&&db.active.category===cat&&sessionSub(db.active)===sub)){
     alert("Cannot remove a subcategory that has sessions.");return;
   }
   db.subcategories[cat]=(db.subcategories[cat]||[]).filter(s=>s!==sub);
   if(selectedStatSub===sub) selectedStatSub=null;
   save();render();return;
 }
 const sp=e.target.closest(".sub-pick");
 if(sp&&sp.dataset.sub!=null){
   setStatSub(sp.dataset.sub);return;
 }
 const st=e.target.closest(".tag-pick");
 if(st&&st.dataset.tag!=null){
   setStatTag(st.dataset.tag);return;
 }
 const sc=e.target.closest(".cat-pick");
 if(sc&&sc.dataset.cat!=null){
   setStatCat(sc.dataset.cat);return;
 }
 const d=e.target.closest(".deleteCat");
 if(d){
   const i=Number(d.dataset.i),cat=db.categories[i];
   if(db.sessions.some(x=>x.category===cat)||db.active?.category===cat){
     alert("Cannot delete a category that has sessions. Change or delete those sessions first.");return;
   }
   delete db.colors[cat];
   delete db.subcategories[cat];
   if(selectedStatCat===cat) clearStatFocus();
   db.categories.splice(i,1);save();render();return;
 }
 const es=e.target.closest(".editSession");
 if(es){
   const i=Number(es.dataset.i),x=db.sessions[i];if(!x)return;
   const cat=prompt("Category:",x.category);if(cat===null)return;
   const n=cat.trim();if(!n)return;
   let sub=sessionSub(x);
   const available=subsOf(n);
   if(available.length){
     const t=prompt(`Subcategory (${available.join(", ")}), empty for none:`,sub);if(t===null)return;
     sub=t.trim();
     if(sub&&!available.includes(sub)){alert("Unknown subcategory.");return}
   }else sub="";
   let tag=sessionTag(x);
   if(available.length){
     const t=prompt("Title / name (optional):",tag);if(t===null)return;
     tag=t.trim();
   }else tag="";
   let dur=prompt("Duration in minutes:",String(Math.max(1,Math.round((x.end-x.start)/60000))));
   const mins=Number(dur);
   if(!Number.isFinite(mins)||mins<=0){alert("Invalid duration.");return}
   if(!db.categories.includes(n)){
     db.categories.push(n);
     db.colors[n]=defaultColor(db.categories.length-1);
     db.subcategories[n]=[];
   }
   x.category=n;x.end=x.start+Math.round(mins*60000);
   if(sub) x.subcategory=sub; else delete x.subcategory;
   if(tag) x.tag=tag; else delete x.tag;
   save();render();return;
 }
 const ds=e.target.closest(".deleteSession");
 if(ds){
   const i=Number(ds.dataset.i);if(!db.sessions[i])return;
   if(confirm("Delete this session?")){db.sessions.splice(i,1);save();render();}
 }
});

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
 setPeriodTab(b.dataset.period);
}));
$("periodPrev").addEventListener("click",()=>{shiftAnchor(currentPeriod(),-1);renderPeriod()});
$("periodNext").addEventListener("click",()=>{shiftAnchor(currentPeriod(),1);renderPeriod()});
$("periodToday").addEventListener("click",()=>{periodAnchor=new Date();renderPeriod()});
document.querySelectorAll("#periodStatsFocus .stat.jump").forEach(b=>b.addEventListener("click",()=>{
 setPeriodTab(b.dataset.jump);
}));

$("export").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="time-backup.json";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$("importBtn").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
    const x=JSON.parse(r.result);
    if(!Array.isArray(x.categories)||!Array.isArray(x.sessions))throw new Error();
    db={categories:x.categories,sessions:x.sessions,active:x.active||null,colors:x.colors&&typeof x.colors==="object"?x.colors:{},subcategories:x.subcategories&&typeof x.subcategories==="object"?x.subcategories:{}};
    ensureColors();ensureSubcategories();save();render();alert("Data imported.");
   }catch(err){alert("Invalid file.");}
   e.target.value="";
 };
 r.readAsText(f);
});
$("wipe").addEventListener("click",()=>{
 if(confirm("Delete all sessions and categories?")){
   db={categories:DEFAULT.slice(),sessions:[],active:null,colors:{},subcategories:{}};ensureColors();ensureSubcategories();save();render();tick();
 }
});
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const input=e.target.closest(".newSubInput");
 if(!input)return;
 e.preventDefault();
 const btn=input.closest(".subcat-panel")?.querySelector(".addSub");
 if(btn) btn.click();
});

render();tick();setInterval(()=>{tick();if(db.active)renderPeriod()},1000);
})();
</script>
</body>
</html>
